name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://migrator:migrator@localhost:5432/compliance
      APP_DATABASE_URL: postgresql://app_user:app_user@localhost:5432/compliance
      REDIS_URL: redis://localhost:6379/0
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      WEBHOOK_SIGNING_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Initialize database roles
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -f docker/postgres/init.sql
      - name: Apply migrations
        run: uv run python manage.py migrate --noinput
      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run mypy .
      - name: Test
        run: uv run pytest
