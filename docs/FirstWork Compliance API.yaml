openapi: 3.0.3
info:
  title: FirstWork Compliance API
  version: 1.0.0
  description: Tenant-scoped compliance rules and evaluation API. Rule property entity
    prefixes are case-insensitive; user. is an alias for worker. and is stored canonically.
paths:
  /api/v1/companies:
    get:
      operationId: companies_list
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Signed next_cursor from a previous page of the same query.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Maximum number of results to return.
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
          description: ''
    post:
      operationId: companies_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyWrite'
        required: true
      security:
      - TenantAPIKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyOutput'
          description: ''
  /api/v1/companies/{company_id}:
    get:
      operationId: companies_retrieve
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyOutput'
          description: ''
  /api/v1/companies/{company_id}/eligible-contracts:
    get:
      operationId: v1_companies_eligible_contracts_retrieve
      description: Return contracts that pass a rule or every pinned rule in a check.
        Pagination is signed keyset-based; UNKNOWN outcomes are excluded.
      parameters:
      - in: query
        name: check_id
        schema:
          type: integer
          minimum: 1
        description: Check to evaluate; specify exactly one of rule_id or check_id.
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: cursor
        schema:
          type: string
        description: Signed next_cursor from a previous page of the same query.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Maximum number of results to return.
      - in: query
        name: rule_id
        schema:
          type: integer
          minimum: 1
        description: Rule to evaluate; specify exactly one of rule_id or check_id.
      - in: query
        name: version
        schema:
          type: integer
          minimum: 1
        description: Rule version; only valid with rule_id. Defaults to current version.
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibleContractsOutput'
          description: ''
  /api/v1/compliance-checks:
    post:
      operationId: v1_compliance_checks_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckCreateInput'
        required: true
      security:
      - TenantAPIKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOutput'
          description: ''
  /api/v1/compliance-checks/{check_id}:
    get:
      operationId: v1_compliance_checks_retrieve
      parameters:
      - in: path
        name: check_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOutput'
          description: ''
    put:
      operationId: v1_compliance_checks_update
      description: Create a new pinned check version. Obtain the current version from
        the check's current_version field; the check GET response does not return
        an ETag.
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Current resource version, for example "1". A missing, invalid,
          or stale version returns 412 VERSION_MISMATCH.
        required: true
      - in: path
        name: check_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInput'
        required: true
      security:
      - TenantAPIKey: []
      responses:
        '200':
          headers:
            ETag:
              schema:
                type: string
              description: The current version as a quoted entity tag, for example
                "1".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOutput'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing, invalid, or stale If-Match; code VERSION_MISMATCH.
  /api/v1/compliance-checks/{check_id}/evaluate:
    post:
      operationId: v1_compliance_checks_evaluate_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Optional tenant-scoped key of up to 255 characters. Reusing the
          key with the same check and contract returns the stored result; using it
          for a different request returns 409. If omitted, a key is generated.
      - in: path
        name: check_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateInput'
        required: true
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request or key.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Key already used for a different request; code IDEMPOTENCY_CONFLICT.
  /api/v1/compliance-checks/{check_id}/evaluate-bulk:
    post:
      operationId: v1_compliance_checks_evaluate_bulk_create
      description: Queue evaluation of the tenant's contracts using the check version
        pinned when the job is created. Contracts created later are excluded.
      parameters:
      - in: path
        name: check_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '202':
          headers:
            Location:
              schema:
                type: string
              description: Relative URL for polling the evaluation job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationJob'
          description: ''
  /api/v1/contracts:
    get:
      operationId: contracts_list
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Signed next_cursor from a previous page of the same query.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Maximum number of results to return.
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
          description: ''
    post:
      operationId: contracts_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractWrite'
        required: true
      security:
      - TenantAPIKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractOutput'
          description: ''
  /api/v1/contracts/{contract_id}:
    get:
      operationId: contracts_retrieve
      parameters:
      - in: path
        name: contract_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractOutput'
          description: ''
  /api/v1/evaluation-jobs/{job_id}:
    get:
      operationId: v1_evaluation_jobs_retrieve
      description: Return status and contract progress for a tenant-owned bulk evaluation.
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationJob'
          description: ''
  /api/v1/rules:
    post:
      operationId: v1_rules_create
      description: Create an active tenant rule at immutable schema version 2. Rule
        references are accepted only when RULE_REFERENCES_ENABLED is true.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreateInput'
        required: true
      security:
      - TenantAPIKey: []
      responses:
        '201':
          headers:
            ETag:
              schema:
                type: string
              description: The current version as a quoted entity tag, for example
                "1".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleOutput'
          description: ''
  /api/v1/rules/{rule_id}:
    get:
      operationId: v1_rules_retrieve
      parameters:
      - in: path
        name: rule_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          headers:
            ETag:
              schema:
                type: string
              description: The current version as a quoted entity tag, for example
                "1".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleOutput'
          description: ''
    put:
      operationId: v1_rules_update
      description: Create a new immutable rule version. Referenced rule versions remain
        pinned until explicitly changed in a later parent version.
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: Current resource version, for example "1". A missing, invalid,
          or stale version returns 412 VERSION_MISMATCH.
        required: true
      - in: path
        name: rule_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleInput'
        required: true
      security:
      - TenantAPIKey: []
      responses:
        '200':
          headers:
            ETag:
              schema:
                type: string
              description: The current version as a quoted entity tag, for example
                "1".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleOutput'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Missing, invalid, or stale If-Match; code VERSION_MISMATCH.
  /api/v1/rules/{rule_id}/archive:
    post:
      operationId: archiveRule
      parameters:
      - in: path
        name: rule_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '204':
          description: No response body
  /api/v1/rules/{rule_id}/dependents:
    get:
      operationId: v1_rules_dependents_list
      description: List immutable rule versions that directly pin a version of this
        rule.
      parameters:
      - in: path
        name: rule_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleDependentOutput'
          description: ''
  /api/v1/rules/{rule_id}/versions:
    get:
      operationId: v1_rules_versions_list
      parameters:
      - in: path
        name: rule_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleVersionOutput'
          description: ''
  /api/v1/workers:
    get:
      operationId: workers_list
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Signed next_cursor from a previous page of the same query.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: Maximum number of results to return.
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPage'
          description: ''
    post:
      operationId: workers_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerWrite'
        required: true
      security:
      - TenantAPIKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerOutput'
          description: ''
  /api/v1/workers/{worker_id}:
    get:
      operationId: workers_retrieve
      parameters:
      - in: path
        name: worker_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - TenantAPIKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerOutput'
          description: ''
components:
  schemas:
    CheckCreateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
        rule_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 1000
      required:
      - name
      - rule_ids
    CheckInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
        rule_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 1000
      required:
      - rule_ids
    CheckOutput:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        current_version:
          type: integer
          nullable: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/CheckVersionOutput'
      required:
      - current_version
      - description
      - id
      - name
      - versions
    CheckVersionOutput:
      type: object
      properties:
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CheckVersionRuleOutput'
      required:
      - created_at
      - rules
      - version
    CheckVersionRuleOutput:
      type: object
      properties:
        rule_id:
          type: integer
        version:
          type: integer
        rule_version_id:
          type: integer
        name:
          type: string
      required:
      - name
      - rule_id
      - rule_version_id
      - version
    CompanyOutput:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        industry:
          type: string
        country:
          type: string
        bank_deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
      required:
      - bank_deposit
      - country
      - created_at
      - id
      - industry
      - name
    CompanyPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CompanyOutput'
        next_cursor:
          type: string
          nullable: true
      required:
      - next_cursor
      - results
    CompanyWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        industry:
          type: string
          maxLength: 200
        country:
          $ref: '#/components/schemas/CountryCode'
        bank_deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - bank_deposit
      - country
      - industry
      - name
    ContractOutput:
      type: object
      properties:
        id:
          type: integer
        worker_id:
          type: integer
        company_id:
          type: integer
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        country:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - company_id
      - country
      - created_at
      - end_date
      - id
      - start_date
      - worker_id
    ContractPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContractOutput'
        next_cursor:
          type: string
          nullable: true
      required:
      - next_cursor
      - results
    ContractWrite:
      type: object
      properties:
        worker_id:
          type: integer
          minimum: 1
        company_id:
          type: integer
          minimum: 1
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        country:
          $ref: '#/components/schemas/CountryCode'
      required:
      - company_id
      - country
      - end_date
      - start_date
      - worker_id
