    EligibleContract:
      type: object
      properties:
        contract_id:
          type: integer
        worker_id:
          type: integer
      required:
      - contract_id
      - worker_id
    EligibleContractsOutput:
      type: object
      properties:
        company_id:
          type: integer
        rule_id:
          type: integer
        rule_version:
          type: integer
        check_id:
          type: integer
        rules:
          type: array
          items:
            type: object
            additionalProperties: {}
        results:
          type: array
          items:
            $ref: '#/components/schemas/EligibleContract'
        next_cursor:
          type: string
          nullable: true
      required:
      - company_id
      - next_cursor
      - results
    EvaluateInput:
      type: object
      properties:
        contract_id:
          type: integer
          minimum: 1
      required:
      - contract_id
    EvaluationCondition:
      type: object
      properties:
        path:
          type: string
        property:
          type: string
        operator:
          type: string
        expected:
          nullable: true
        actual:
          nullable: true
        status:
          type: string
        reason:
          type: string
        via:
          type: array
          items:
            type: string
      required:
      - actual
      - expected
      - operator
      - path
      - property
      - reason
      - status
    EvaluationJob:
      type: object
      properties:
        job_id:
          type: integer
        check_id:
          type: integer
        check_version:
          type: integer
        status:
          $ref: '#/components/schemas/StatusEnum'
        total_contracts:
          type: integer
        completed_contracts:
          type: integer
        progress_percent:
          type: integer
          readOnly: true
        error:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - check_id
      - check_version
      - completed_at
      - completed_contracts
      - created_at
      - error
      - job_id
      - progress_percent
      - started_at
      - status
      - total_contracts
    EvaluationOutput:
      type: object
      properties:
        evaluation_id:
          type: integer
        outcome:
          type: string
        compliant:
          type: boolean
          readOnly: true
          description: True only when outcome is COMPLIANT. False also includes INDETERMINATE.
        as_of:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/EvaluationSummary'
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluation'
      required:
      - as_of
      - compliant
      - evaluation_id
      - outcome
      - results
      - summary
    EvaluationSummary:
      type: object
      properties:
        rules:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        unknown:
          type: integer
      required:
      - failed
      - passed
      - rules
      - unknown
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors: {}
      required:
      - code
      - status
      - title
      - type
    RuleCreateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
        definition:
          description: Expression tree with conditions, AND/OR groups, and (when enabled)
            rule_ref nodes containing a rule_id and optional version. The user. entity
            prefix is accepted as an alias for worker. and stored canonically.
      required:
      - definition
      - name
    RuleDependentOutput:
      type: object
      properties:
        rule_id:
          type: integer
        version:
          type: integer
        name:
          type: string
        referenced_version:
          type: integer
      required:
      - name
      - referenced_version
      - rule_id
      - version
    RuleEvaluation:
      type: object
      properties:
        rule_id:
          type: integer
        version:
          type: integer
        status:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationCondition'
      required:
      - conditions
      - rule_id
      - status
      - version
    RuleInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
        definition:
          description: Expression tree with conditions, AND/OR groups, and (when enabled)
            rule_ref nodes containing a rule_id and optional version. The user. entity
            prefix is accepted as an alias for worker. and stored canonically.
      required:
      - definition
    RuleOutput:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        status:
          type: string
        current_version:
          type: integer
          nullable: true
        definition:
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - current_version
      - definition
      - description
      - id
      - name
      - status
      - updated_at
    RuleVersionOutput:
      type: object
      properties:
        version:
          type: integer
        schema_version:
          type: integer
        definition: {}
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - created_by
      - definition
      - schema_version
      - version
    StatusEnum:
      enum:
      - PENDING
      - RUNNING
      - COMPLETED
      - FAILED
      type: string
      description: |-
        * `PENDING` - Pending
        * `RUNNING` - Running
        * `COMPLETED` - Completed
        * `FAILED` - Failed
    WorkerOutput:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        date_of_birth:
          type: string
          format: date
        nationality:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - date_of_birth
      - id
      - name
      - nationality
    WorkerPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WorkerOutput'
        next_cursor:
          type: string
          nullable: true
      required:
      - next_cursor
      - results
    WorkerWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        date_of_birth:
          type: string
          format: date
        nationality:
          $ref: '#/components/schemas/CountryCode'
      required:
      - date_of_birth
      - name
      - nationality
  securitySchemes:
    TenantAPIKey:
      type: http
      scheme: bearer
      bearerFormat: tenant-id.secret
